<body>

    <a class="navbar-brand" href="index.html">Assignment 5</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Part 1: Intro</a></li><li class="nav-item"><a class="nav-link" href="part2.html">Part 2: DOM</a></li><li class="nav-item"><a class="nav-link active" href="part3.html">Part 3: Events</a></li><li class="nav-item"><a class="nav-link" href="part4.html">Part 4: To-Do App</a></li></ul></div>

<main class="container py-4">
<h1 class="mb-4">Part 3. Events</h1>

<section class="card mb-4">
  <div class="card-body">
    <h2 class="h4">Task 5. Mouse Events</h2>
    <p>Move the mouse over the box and then away from it.</p>
    <div id="mouseBox" class="mouse-box">Hover me</div>
  </div>
</section>

<section class="card mb-4">
  <div class="card-body">
    <h2 class="h4">Task 6. Keyboard Events</h2>
    <label for="textInput" class="form-label">Type something</label>
    <input type="text" id="textInput" class="form-control mb-2" placeholder="Start typing...">
    <p class="mb-0">You typed: <strong id="typedText"></strong></p>
  </div>
</section>

<section class="card mb-4">
  <div class="card-body">
    <h2 class="h4">Task 7. Calculator</h2>
    <div class="row g-2 mb-3">
      <div class="col-md-5"><input type="number" id="num1" class="form-control" placeholder="First number"></div>
      <div class="col-md-2">
        <select id="operation" class="form-select">
          <option value="+">+</option>
          <option value="-">-</option>
          <option value="*">&times;</option>
          <option value="/">&divide;</option>
        </select>
      </div>
      <div class="col-md-5"><input type="number" id="num2" class="form-control" placeholder="Second number"></div>
    </div>
    <button id="calcBtn" class="btn btn-primary">Calculate</button>
    <p class="mt-3 mb-0 fs-5">Result: <strong id="calcResult">-</strong></p>
  </div>
</section>
</main>
<footer class="text-center text-muted py-3 border-top">Assignment #5 &middot; JavaScript Basics</footer>
